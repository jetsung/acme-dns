name: Docker-Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: false
        default: ''

env:
  GHCR_SLUG: ghcr.io/${{ github.repository }}
  image_org: 'jetsung'
  acr_registry: registry.cn-guangzhou.aliyuncs.com
  tcr_registry: sgccr.ccs.tencentyun.com

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            tag_suffix: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            tag_suffix: arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      package_name: ${{ steps.get_package_name.outputs.package_name }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set package name
        id: get_package_name
        run: |
          PACKAGE_NAME="$(basename ${{ github.repository }})"
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            version=${{ github.ref_name }}
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            version=${{ github.event.inputs.version }}
          else
            version=latest-$(date +%Y%m%d)
          fi
          # 去掉 v 前缀，与 Cargo.toml 版本号保持一致风格
          echo "version=${version#v}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.GHCR_SLUG }}:${{ steps.get_version.outputs.version }}-${{ matrix.tag_suffix }}
          provenance: false
          sbom: false

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create --tag ${{ env.GHCR_SLUG }}:${{ needs.build.outputs.version }} \
            ${{ env.GHCR_SLUG }}:${{ needs.build.outputs.version }}-amd64 \
            ${{ env.GHCR_SLUG }}:${{ needs.build.outputs.version }}-arm64
          docker buildx imagetools create --tag ${{ env.GHCR_SLUG }}:latest \
            ${{ env.GHCR_SLUG }}:${{ needs.build.outputs.version }}-amd64 \
            ${{ env.GHCR_SLUG }}:${{ needs.build.outputs.version }}-arm64
        shell: bash

      - name: Delete old package versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package-name: ${{ needs.build.outputs.package_name }}
          delete-untagged: true
          keep-n-tagged: 10

  # 可选：同步镜像到 Docker Hub（配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 后启用）
  sync-to-dockerhub:
    needs: [build, manifest]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check Docker Hub credentials
        id: check_dockerhub
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Docker Hub credentials not configured, skipping..."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Skopeo
        if: steps.check_dockerhub.outputs.skip != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo

      - name: Login to ghcr.io
        if: steps.check_dockerhub.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.check_dockerhub.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Sync image to Docker Hub
        if: steps.check_dockerhub.outputs.skip != 'true'
        run: |
          skopeo copy --all docker://${{ env.GHCR_SLUG }}:${{ needs.build.outputs.version }} \
            docker://docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ needs.build.outputs.package_name }}:${{ needs.build.outputs.version }}
          skopeo copy --all docker://${{ env.GHCR_SLUG }}:latest \
            docker://docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ needs.build.outputs.package_name }}:latest

  # 可选：同步镜像到国内镜像仓库（阿里云 ACR / 腾讯云 TCR，配好对应 secrets 后启用）
  sync-to-china-registries:
    needs: [build, manifest]
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      matrix:
        include:
          - registry: sgccr.ccs.tencentyun.com
            secret_prefix: TCR
          - registry: registry.cn-guangzhou.aliyuncs.com
            secret_prefix: ACR
    steps:
      - name: Install Skopeo
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to target registry
        uses: docker/login-action@v4
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets[format('{0}_USERNAME', matrix.secret_prefix)] }}
          password: ${{ secrets[format('{0}_TOKEN', matrix.secret_prefix)] }}

      - name: Sync image to target registry
        run: |
          skopeo copy --all docker://${{ env.GHCR_SLUG }}:${{ needs.build.outputs.version }} \
            docker://${{ matrix.registry }}/${{ env.image_org }}/${{ needs.build.outputs.package_name }}:${{ needs.build.outputs.version }}
          skopeo copy --all docker://${{ env.GHCR_SLUG }}:latest \
            docker://${{ matrix.registry }}/${{ env.image_org }}/${{ needs.build.outputs.package_name }}:latest
