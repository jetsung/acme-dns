name: CI

on:
  push:
    branches: [main, dev*]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: 格式与静态检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 检查代码格式
        run: cargo fmt --all -- --check

      - name: Clippy（拒绝任何警告）
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: 全量测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 集成测试（含 e2e：register → update → dig TXT 查询）与单元测试一起跑
      - name: 运行全部测试
        run: cargo test

  build:
    name: 构建检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release 构建
        run: cargo build --release

      - name: 验证二进制可执行
        run: ./target/release/acme-dns version

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
